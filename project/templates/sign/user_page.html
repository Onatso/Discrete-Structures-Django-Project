<style>
    body {
      font-family: sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      position: relative; /* Для позиционирования кнопок */
    }


    .page-top-right-button {
      top: 20px;
      left: 10px;
      padding: 10px 20px;
      background-color: #2196F3; /* Синий */
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      text-decoration: none;
      font-size: 1em;
      z-index: 1000;
    }

    .container {
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
      padding: 40px;
      width: 80%;
      max-width: 800px;
      text-align: center;
      margin-top: 60px; /* Чтобы контент не перекрывался кнопками */
    }

    /* Остальные стили остаются без изменений */
    .profile-picture {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 20px;
      border: 5px solid #ddd;
    }

    .username {
      font-size: 2em;
      font-weight: bold;
      color: #333;
      margin-bottom: 10px;
    }

    .bio {
      font-size: 1em;
      color: #666;
      margin-bottom: 20px;
    }

    .details {
      text-align: left;
      margin-bottom: 30px;
    }

    .details h3 {
      font-size: 1.5em;
      color: #444;
      margin-bottom: 10px;
    }

    .details p {
      font-size: 1.1em;
      color: #777;
      margin-bottom: 5px;
    }

    .logout {
      margin-top: 20px;
    }

    .logout button {
      padding: 10px 20px;
      background-color: #f44336;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .logout button a {
      color: white;
      text-decoration: none;
    }


  .home-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background-color: #3498db;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: background 0.3s, transform 0.2s;
        }
        .home-button img {
            width: 24px;
            height: 24px;
            filter: invert(1);
        }
        .home-button:hover {
            background-color: #2980b9;
            transform: scale(1.1);
        }
</style>

{% load allauth i18n %}

<head>
  <title>Страница пользователя</title>
</head>

{% block content %}
  <div class="container">
    <h1 class="username">{{user.username}}</h1>
    <p class="bio">Люблю булевы функции и графы. Обожаю Евгения Черкашина!</p>

    <div class="details">
      <h3>Информация</h3>
      <p><b>Студент:</b> {{user.username}}</p>
      <p><b>Email:</b> {{user.email}}</p>

      <p>
            <a href="{% url 'achievement_list' %}" class="page-top-right-button">Мои Достижения</a>
      </p>
    </div>


    <div class="logout">
      <button><a href="{% url 'account_logout' %}">Выход из аккаунта</a></button>
    </div>
    <a href="/" class="home-button">
        <img src="https://cdn-icons-png.flaticon.com/512/25/25694.png" alt="Home">
    </a>
  </div>


{% endblock content %}
