            display: flex;

        }

            padding: 15px;
            margin-bottom: 20px;
            position: relative;
            display: flex;
            justify-content: space-between;
            height: 70px;
        }
        .character-name {
            position: absolute;
            top: -20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-weight: bold;

        .dialog-text {
            font-size: 18px;
            padding-left: 10px;
        }
        .dialog-icons {
            display: flex;

        }
        .icon {
            width: 16px;
            height: 16px;
            background-color: #E3C567;
            border-radius: 3px;
        }
        .next-button {
            width: 70px;
            height: 70px;
            background: url('https://pngfre.com/wp-content/uploads/leaf-poster.png') no-repeat center;
            background-size: contain;
            cursor: pointer;
            transform: rotate(142deg);
        }
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .modal-close-btn1, .modal-close-btn2 {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            padding: 10px;
            transition: opacity 0.3s;
        }

        .modal-close-btn1:hover, .modal-close-btn2:hover {
            opacity: 0.8;
        }
        body.modal-open {
            overflow: hidden;
        }

    function submitForm(event) {
      if (event) {
        event.preventDefault();
      }
      const form = document.getElementById('hiddenForm');
      const formData = new FormData(form);
      fetch(form.action, {
        method: 'POST',
        body: formData,
        headers: {
            'X-CSRFToken': formData.get('csrfmiddlewaretoken')
        }
      })
      .then(response => response.json())
      .then(data => {
          if (data.right_or_not){
          document.body.style.background = "url('{% static "images/63.2.png" %}')";
          document.body.style.backgroundSize = "cover";
          textElement.textContent="";
          index=0;
          name.textContent="";
          text="Задача решена верно, хорошая концовка. Спасибо за игру, второй день ждите на конференции по графам))";
          typeText();
          document.getElementById("next-button").onclick = function() {
    window.location.href = '/';
};
          }
          else{
          document.body.style.background = "url('{% static "images/63.2.png" %}')";
          document.body.style.backgroundSize = "cover";
          textElement.textContent="";
          index=0;

};
          }
      })
    }
