{% include 'template_title.html' %}
<!DOCTYPE html>
<html>
<head>
    {% load static %}
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-image: url('{% static "images/tasks/5/main.png" %}');
            background-size: cover;
            background-position: center;
            color: white;
            font-family: 'Courier New', monospace;
            text-align: center;
        }

        .overlay {
            background-color: rgba(0, 0, 0, 0.7);
            padding: 2rem;
            border-radius: 10px;
            position: relative;
            min-width: 400px;
            margin-bottom: 100px;
        }

        #binary {
            font-size: 2.5em;
            letter-spacing: 0.3em;
            margin: 20px 0;
            color: #00ff00;
        }

        .buttons {
            margin-top: 30px;
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .pill-btn {
            padding: 10px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.2em;
            transition: all 0.3s;
        }

        .redbtn {
            background-color: #ff0000;
            color: white;
        }

        .bluebtn {
            background-color: #0000ff;
            color: white;
        }

        .digits-container {
            position: absolute;
            bottom: -80px;
            left: -87px;
            right: -90px;
            height: 40px;
        }

        .digit {
            -webkit-text-stroke: 1px #FFFFFF;
            font-size: 3em;
            font-weight: bold;
            position: absolute;
            transition: none;
        }

        .digit.red {
            color: #ff0000;
            left: 0;
        }

        .digit.blue {
            color: #0000ff;
            right: 0;
        }

        .digit:nth-child(1) { top: 0; }
        .digit:nth-child(2) { top: 50px; }
        .digit:nth-child(3) { top: 100px; }

        .check-button-container {
            margin-top: 20px;
            text-align: center;
        }

        .check-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.2em;
            background-color: #ff0000;
            color: white;
            transition: background-color 0.3s;
        }
.check-btn:disabled {
    background-color: #ff9999;
    color: #ffffffcc;
    cursor: not-allowed;
    opacity: 0.7;
    box-shadow: none;
}

.check-btn:not(:disabled) {
    transition: background-color 0.3s, opacity 0.3s;
}
        .check-btn:hover {
            background-color: #cc0000;
        }


        #hiddenForm{
            display: none;
        }
        .home-button {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 50px;
    height: 50px;
    background-color: #000;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
    border: 2px solid #0f0;
    transition: all 0.3s ease;
    overflow: hidden;
    cursor: pointer;
}

.home-button::before {
    content: '';
    position: absolute;
    width: 150%;
    height: 150%;
    background: linear-gradient(
        #0f0 0%,
        transparent 30%,
        transparent 70%,
        #0f0 100%
    );
    animation: matrix-glow 3s linear infinite;
    opacity: 0.3;
}

.home-button img {
    width: 24px;
    height: 24px;
    filter: invert(65%) sepia(73%) saturate(638%) hue-rotate(41deg) brightness(130%) contrast(119%);
    position: relative;
    z-index: 1;
}

.home-button:hover {
    transform: scale(1.1) rotate(360deg);
    box-shadow: 0 0 25px rgba(0, 255, 0, 0.8);
    background-color: #001a00;
}

.home-button:hover::before {
    opacity: 0.6;
}

@keyframes matrix-glow {
    0% { transform: rotate(0deg) translate(-50%, -50%); }
    100% { transform: rotate(360deg) translate(-50%, -50%); }
}
       button:disabled{

       }
    </style>
</head>
<body>
    <div class="overlay">
        <div id="binary"></div>
        <p>"Красная - фиктивная, синяя - существенная"</p>
        <div class="buttons">
            <button class="pill-btn redbtn">1</button>
            <button class="pill-btn redbtn">2</button>
            <button class="pill-btn redbtn">3</button>
        </div>
        <div class="check-button-container">
            <button id="checkButton" class="check-btn redbtn" onclick="checkResult()">Проверить</button>
        </div>
        <div class="digits-container">
            <div class="digit red">1</div>
            <div class="digit red">2</div>
            <div class="digit red">3</div>
        </div>
    </div>

    <a href="/" class="home-button">
        <img src="https://cdn-icons-png.flaticon.com/512/25/25694.png" alt="Home">
    </a>

    <script>
        function generateBinary() {
            const number = Math.floor(Math.random() * 256);
            return number.toString(2).padStart(8, '0');
        }

        btns="000";
        const checkButton = document.getElementById('checkButton');

        document.getElementById('binary').textContent = generateBinary();

        document.querySelectorAll('.pill-btn').forEach((button, index) => {
            button.addEventListener('click', function() {
                const isBlue = this.classList.toggle('bluebtn');
                this.classList.toggle('redbtn');
                const digit = document.querySelectorAll('.digit')[index];
                digit.classList.toggle('red', !isBlue);
                digit.classList.toggle('blue', isBlue);
                if(isBlue) btns = btns.substring(0, index) + '1' + btns.substring(index + 1);
                else btns = btns.substring(0, index) + '0' + btns.substring(index + 1);
            });
        });

        function checkResult() {
            document.getElementById('hiddenFormInput1').value = document.getElementById('binary').textContent;
            document.getElementById('hiddenFormInput2').value = btns;
            console.log(document.getElementById('hiddenFormInput1').value);
            console.log(document.getElementById('hiddenFormInput2').value);
            submitForm();
        }

        function submitForm(event) {
            if (event) {
                event.preventDefault();
            }
            const form = document.getElementById('hiddenForm');
            const formData = new FormData(form);
            fetch(form.action, {
                method: 'POST',
                body: formData,
                headers: {
                    'X-CSRFToken': formData.get('csrfmiddlewaretoken')
                }
            })
            .then(response => response.json())
            .then(data => {
            //alert(data["ans"]);
                if (data["ans"]){

                    document.body.style.backgroundImage = "url('{% static 'images/tasks/5/Yes.png' %}')";
                    checkButton.disabled = true;
                    setTimeout(() => {
                            document.body.style.backgroundImage = "url('{% static 'images/tasks/5/main.png' %}')";
                            checkButton.disabled = false;
                    }, 3000);
                    document.getElementById('binary').textContent = generateBinary();
                }
                else{
                    document.body.style.backgroundImage = "url('{% static 'images/tasks/5/No.png' %}')";
                    checkButton.disabled = true;

                    setTimeout(() => {
                            document.body.style.backgroundImage = "url('{% static 'images/tasks/5/main.png' %}')";
                            checkButton.disabled = false;
                    }, 3000);
                }
            })

        }
    </script>
</body>
</html>

<form action="{% url 'task_detail' pk=task.pk %}" method="post" id="hiddenForm">
    {% csrf_token %}
    <input type="text" id="hiddenFormInput1" name = "binary_string">
    <input type="text" id="hiddenFormInput2" name = "user_answer">
</form>
