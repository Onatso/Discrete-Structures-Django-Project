<!DOCTYPE html>
<html>
<head>
    <title>task2</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: #f0f4f8;
            color: #2c3e50;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        input, button {
            padding: 10px 15px;
            border: 2px solid #3398d9;
            border-radius: 25px;
            margin: 5px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        button {
            background-color: #3398d9;
            color: white;
            cursor: pointer;
            border: none;
        }

        button:hover {
            background-color: #2878a8;
        }

        #adjacency-list {
            background-color: white;
            padding: 15px;
            border-radius: 12px;
            margin: 20px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .list-header {
            font-weight: bold;
            color: #3398d9;
            margin-bottom: 10px;
        }

        canvas {
            background: #ffffff;
            border: 2px solid #3398d9;
            border-radius: 15px;
            margin: 20px auto;
            display: block;
        }

        .home-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background-color: #3398d9;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: background 0.3s, transform 0.2s;
        }

        .home-button img {
            width: 24px;
            height: 24px;
            filter: invert(1);
        }

        .home-button:hover {
            background-color: #2980b9;
            transform: scale(1.1);
        }

        #hiddenForm {
            display: none;
        }

        .answer-section {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        #result {
            font-weight: bold;
            color: #3398d9;
            margin-top: 15px;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="controls">
        <div>
            <label for="vertexCount">Введите количество вершин (1-20):</label>
            <input type="number" id="vertexCount" min="1" max="20">
        </div>
        <button onclick="processGraph()">Построить</button>
    </div>

    <div id="adjacency-list">
        <div class="list-header">Список смежности</div>
    </div>

    <div class="answer-section">
        <label for="userAnswer">Введите обход графа в глубину через пробел:</label>
        <input type="text" id="userAnswer">
        <button onclick="run()">Обработать</button>
        <div id="result"></div>
    </div>

    <div class="graph-container"></div>



    <a href="/" class="home-button">
        <img src="https://cdn-icons-png.flaticon.com/512/25/25694.png" alt="Home">
    </a>


    <script>
        let count;
        let Graph;

        function processGraph() {
            document.querySelector('.graph-container').innerHTML = '';

            count = parseInt(document.getElementById('vertexCount').value);
            Graph = generateConnections();
            updateAdjacencyList(Graph);

            const edges = [];
            for (let u = 0; u < Graph.length; u++) {
                for (const v of Graph[u]) {
                    if (v >= 0 && v < count) {
                        edges.push([u + 1, v + 1]);
                    }
                }
            }
            drawGraph(count, edges);
        };

        function run(){
            document.getElementById('hiddenFormInput1').value = JSON.stringify(Graph);
            document.getElementById('hiddenFormInput2').value = document.getElementById('userAnswer').value;
            console.log(document.getElementById('hiddenFormInput1').value);
            console.log(document.getElementById('hiddenFormInput2').value);
            submitForm();
        }

         function submitForm(event) {
            if (event) {
                event.preventDefault();
            }
            const form = document.getElementById('hiddenForm');
            const formData = new FormData(form);
            fetch(form.action, {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if(data.right_or_not) document.getElementById("result").textContent = "Верно";
                else document.getElementById("result").textContent = "Неверно";
            })
        }

        function updateAdjacencyList(graph) {
            const container = document.getElementById('adjacency-list');
            container.innerHTML = '<div class="list-header">Список смежности</div>';

            graph.forEach((connections, node) => {
                const div = document.createElement('div');
                div.className = 'node-item';

                const numberSpan = document.createElement('span');
                numberSpan.className = 'node-number';
                numberSpan.textContent = `${node + 1}:`;

                const connSpan = document.createElement('span');
                connSpan.className = 'node-connections';
                connSpan.textContent = connections.map(n => n + 1).join(', ');

                div.appendChild(numberSpan);
                div.appendChild(connSpan);
                container.appendChild(div);
            });
        }

        function generateConnections() {
            const connections = Array.from({ length: count }, () => []);

            for (let i = 0; i < count; i++) {
                let randomNumber = i;
                while(randomNumber===i){
                    randomNumber = Math.floor(Math.random() * count);
                }
                connections[i].push(randomNumber);
                connections[randomNumber].push(i);

                for (let j = i + 1; j < count; j++) {
                    if (Math.random() < 0.05 && j !== randomNumber) {
                        connections[i].push(j);
                        connections[j].push(i);
                    }
                }
            }

            connections.forEach(arr => arr.sort((a, b) => a - b));
            answer = connections.map(sub => {
                return [...new Set(sub)];
            });
            return answer;
        }

         function drawGraph(vertexCount, edges) {
        const container = document.querySelector('.graph-container');
        container.innerHTML = '';

        const canvas = document.createElement('canvas');
        canvas.width = 600;
        canvas.height = 600;
        container.appendChild(canvas);

        const ctx = canvas.getContext('2d');
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const radius = 200;

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const vertexPositions = [];
        for (let i = 0; i < vertexCount; i++) {
            const angle = (2 * Math.PI * i) / vertexCount;
            vertexPositions.push({
                x: centerX + radius * Math.cos(angle),
                y: centerY + radius * Math.sin(angle)
            });
        }

        ctx.strokeStyle = '#3398d9';
        ctx.lineWidth = 2;
        for (const [u, v] of edges) {
            const start = vertexPositions[u - 1];
            const end = vertexPositions[v - 1];

            ctx.beginPath();
            ctx.moveTo(start.x, start.y);
            ctx.lineTo(end.x, end.y);
            ctx.stroke();
        }

        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#3398d9';
        ctx.lineWidth = 2;

        for (let i = 0; i < vertexCount; i++) {
            const pos = vertexPositions[i];

            ctx.beginPath();
            ctx.arc(pos.x, pos.y, 20, 0, 2 * Math.PI);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#3398d9';
            ctx.font = '16px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText((i + 1).toString(), pos.x, pos.y);

            ctx.fillStyle = '#ffffff';
        }
    }
    </script>

    <form action="{% url 'task_detail' pk=task.pk %}" method="post" id="hiddenForm">
        {% csrf_token %}
        <input type="text" id="hiddenFormInput1" name = "item_sequence">
        <input type="text" id="hiddenFormInput2" name = "way">
    </form>
</body>
</html>
